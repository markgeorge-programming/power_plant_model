<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANT AC POWER PREDICTION</title>
    <style>
        /* The Egoist Dark Mode Architecture */
        body {
            background-color: #0d1117; /* GitHub Dark Mode Base */
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .matrix-container {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 450px;
            border: 1px solid #30363d;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #58a6ff; /* sleek tech blue */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #ffffff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
        }
        .deploy-btn {
            width: 100%;
            padding: 14px;
            background: #238636; /* Success Green */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .deploy-btn:hover {
            background: #2ea043;
            box-shadow: 0 0 15px rgba(46, 160, 67, 0.4);
        }
        .result-matrix {
            margin-top: 25px;
            padding: 20px;
            background: rgba(248, 81, 73, 0.1);
            border-left: 4px solid #f85149;
            border-radius: 4px;
            text-align: center;
            animation: pulse 2s infinite;
        }
        .result-matrix h3 {
            margin: 0;
            color: #f85149;
            font-size: 1.8rem;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); }
            100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
        }
    </style>
</head>

<body>
    <div class="matrix-container">
        <h1>Plant AC power Analyzer</h1>
        <form method="POST">

            <div class="form-group">
                <label for="AMBIENT_TEMPERATURE">Ambient Tempreature: <span id="AMBIENT_TEMPERATURE_SLIDER">42</span></label>
                <input type="range" id="AMBIENT_TEMPERATURE" name="AMBIENT_TEMPERATURE" min="20" max="68" step="1" value="42"
       oninput="document.getElementById('AMBIENT_TEMPERATURE_SLIDER').innerText = this.value">
            </div>

            <div class="form-group">
                <label for="IRRADIATION">Irradiation: <span id="slider-val">0.5</span></label>
                <input type="range" id="IRRADIATION" name="IRRADIATION" min="0" max="1.1" step="0.01" value="0.5"
       oninput="document.getElementById('slider-val').innerText = this.value">
            </div>

            <div class="form-group">
                <label for="MODULE_TEMPREATURE">Module Tempreature: <span id="ModuleTemp_SLIDER">24</span></label>
                <input type="range" id="MODULE_TEMPREATURE" name="MODULE_TEMPREATURE" min="20" max="38" step="1" value="24"
       oninput="document.getElementById('ModuleTemp_SLIDER').innerText = this.value">
            </div>

            <button type="submit" class="deploy-btn">Run Prediction</button>
        </form>

        {% if prediction is not none %}
            <div class="result-matrix">
                <h3>{{ prediction }} kW</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
